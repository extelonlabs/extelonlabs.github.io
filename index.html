<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#141519">
  <meta name="description" content="Public projects by Extelon Labs, including games, Windows utilities, and web tools.">
  <title>Extelon Labs — Public Projects</title>
  <link rel="icon" href="library/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="library/styles.css">
  <script type="module" src="library/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14m-1-9H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m7 7-5 5 5 5m10-10 5 5-5 5m-3-14-4 18"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M10 14.6V5a2 2 0 0 1 4 0v9.6a4 4 0 1 1-4 0ZM12 10v7"/><circle cx="12" cy="18" r="1"/><path d="M17 6h3m-3 4h2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5 20 6v6c0 4.5-3.7 8-8 9.5C7.7 20 4 16.5 4 12V6Z"/><path d="m8 11 2 4 2-4 2 4 2-4"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/><path d="m5 15 2-4 4 3 3-4 4 3 1-4"/></symbol>
  </svg>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="sidebar" aria-label="Site navigation">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Extelon Labs<span class="brand-sub">Project home</span></span>
    </a>
    <nav class="site-nav" aria-label="Homepage">
      <a href="#home"><svg aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a href="#projects"><svg aria-hidden="true"><use href="#i-grid"/></svg>Public projects</a>
    </nav>
    <nav class="project-nav" aria-labelledby="sidebar-title">
      <h2 id="sidebar-title">Projects</h2>
      <ul id="project-links"></ul>
    </nav>
    <a class="sidebar-github" href="https://github.com/extelonlabs">
      GitHub profile <svg aria-hidden="true"><use href="#i-external"/></svg>
    </a>
  </aside>
  <main id="main" tabindex="-1">
    <header class="welcome" id="home">
      <div class="welcome-copy">
        <h1>Things I <em>build.</em></h1>
        <p>Games, Windows utilities, and web tools by Extelon Labs.</p>
        <div class="hero-actions">
          <a class="primary" href="#projects">Explore projects <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
          <a class="quiet-link" href="https://github.com/extelonlabs">GitHub <svg aria-hidden="true"><use href="#i-external"/></svg></a>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-orbit"></div>
        <div class="art-orbit orbit-two"></div>
        <div class="art-window window-back">
          <div class="art-window-bar"><i></i><i></i><i></i></div>
          <div class="art-code"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="art-window window-front">
          <div class="art-window-bar"><i></i><i></i><i></i><span>extelonlabs.github.io</span></div>
          <div class="art-page">
            <svg><use href="#i-code"/></svg>
            <div class="art-lines"><i></i><i></i></div>
          </div>
        </div>
      </div>
    </header>
    <section class="collection" id="projects" aria-labelledby="collection-title">
      <h2 id="collection-title">Public projects</h2>
      <div class="project-grid" id="project-grid"></div>
      <noscript>
        <p class="fallback">Browse the projects on <a href="https://github.com/extelonlabs?tab=repositories">GitHub</a>, or open <a href="dice/">RimWorld Trait Dice</a> or <a href="map-picker/">Battle Map Picker</a>.</p>
      </noscript>
    </section>
    <footer class="page-footer">
      <span>Extelon Labs</span>
      <a href="https://github.com/extelonlabs/extelonlabs.github.io">Homepage source <svg aria-hidden="true"><use href="#i-external"/></svg></a>
    </footer>
  </main>

  <template id="project-card-template">
    <article class="project-card">
      <div class="card-cover" aria-hidden="true"></div>
      <div class="card-body">
        <p class="card-category"></p>
        <h3></h3>
        <p class="card-description"></p>
        <div class="card-actions">
          <a class="project-action"><span></span> <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
          <a class="repository-link">Source <svg aria-hidden="true"><use href="#i-external"/></svg></a>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
