<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extelon Labs</title>

  <!-- Old share links (extelonlabs.github.io/#roll=...) now live on the dice page -->
  <script>
    if (location.hash.startsWith("#roll=")) location.replace("dice/" + location.hash);
  </script>

  <link rel="stylesheet" href="dice/styles.css" />
  <link rel="icon" type="image/png" href="dice/images/pawn.png" />
  <style>
    .pages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .page-card {
      display: block;
      color: inherit;
      text-decoration: none;
      transition: transform .16s ease, border-color .16s ease;
    }
    .page-card:hover { transform: translateY(-3px); border-color: #64748b; }
    .page-card h2 { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Extelon Labs</h1>
      <p class="lead">Small tools and games. Pick one.</p>
    </section>

    <div class="pages">
      <a class="panel page-card" href="dice/">
        <h2>🎲 RimWorld Trait Dice Game</h2>
        <p class="lead">Roll random RimWorld traits. Lock, reroll, save and share rolls.</p>
      </a>
      <a class="panel page-card" href="map-picker/">
        <h2>🗺️ Battle Map Picker</h2>
        <p class="lead">Browse battle sites on the Calradia map and pick road spots.</p>
      </a>
    </div>
  </div>
</body>
</html>
