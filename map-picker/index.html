<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Layer Sites</title>
<style>
:root{--bg:#f3efe6;--panel:#fffdf8;--ink:#2b2a26;--muted:#6b665a;--line:#d9d1c0;--accent:#8a4b1f;--road:#5a4630;--site:#c0392b;--pick:#1f6fb2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1a17;--panel:#25231f;--ink:#ece6d8;--muted:#a59e8d;--line:#3d3a33;--accent:#e0a36b;--road:#f0dcae;--site:#ff6b5a;--pick:#6fb4ff}}
:root[data-theme="dark"]{--bg:#1b1a17;--panel:#25231f;--ink:#ece6d8;--muted:#a59e8d;--line:#3d3a33;--accent:#e0a36b;--road:#f0dcae;--site:#ff6b5a;--pick:#6fb4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 6px}
h1{font-size:18px;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:10px 16px 24px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:82vh}
#map{display:block;width:100%;cursor:crosshair}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
aside h2{font-size:16px;margin:0 0 6px}
#diagram{width:100%;max-width:340px;aspect-ratio:1;display:block;border:1px solid var(--line);border-radius:6px;margin:8px 0}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
code,pre{font:12px/1.4 ui-monospace,Consolas,monospace}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.spotbar{position:fixed;right:16px;bottom:16px;max-width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:10;font-size:14px}
.spotbar ol{margin:6px 0 8px 18px;padding:0}.spotbar li{margin:2px 0}
.btn{font:inherit;padding:6px 10px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;margin:2px 4px 2px 0}
.btn.ghost{background:transparent;color:var(--accent)}.copied{color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header>
<p><a href="../" style="color:var(--muted)">← Home</a></p>
<h1>Battle layer: 800 m sites</h1>
<p>Click a red square for its site card. Click near any road to get the nearest road spot and a ready CLI line.</p>
</header>
<main>
<section>
<div class="tools"><button data-z="fit" class="on">Fit</button><button data-z="1">1x</button><button data-z="2">2x</button><button data-z="3">3x</button><span id="sitebtns"></span></div>
<div class="mapwrap" id="wrap"><canvas id="map"></canvas></div>
</section>
<aside id="panel"><h2>Pick a site or a road</h2><p>Nothing selected yet.</p></aside>
</main>
<div class="spotbar" id="spotbar"><b>My spots for Claude</b> <span id="spotcount">(0)</span>
<ol id="spotlist"></ol>
<button class="btn" onclick="copyAll()">Copy all for Claude</button><button class="btn ghost" onclick="clearSpots()">Clear</button><span class="copied" id="copiedAll"></span></div>

const BIOME={0:'#6f9fc8',1:'#8fbf6a',2:'#eef2f6',3:'#cdbb78',4:'#e3c48f',255:'#999'};
const NAMES={0:'water',1:'grassland',2:'snow',3:'steppe',4:'desert'};
const cv=document.getElementById('map'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap'),panel=document.getElementById('panel');
const [RW,RH]=DATA.ref;cv.width=RW;cv.height=RH;
let pick=null,active=null;
const img=new Image();img.onload=draw;img.src=IMG;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(){
  cx.clearRect(0,0,RW,RH);cx.drawImage(img,0,0,RW,RH);
  cx.lineJoin='round';cx.lineWidth=2.2;cx.strokeStyle='rgba(60,45,25,.85)';
  for(const r of DATA.roads){cx.beginPath();for(let i=0;i<r.p.length;i+=2){i?cx.lineTo(r.p[i],r.p[i+1]):cx.moveTo(r.p[i],r.p[i+1])}cx.stroke()}
  cx.lineWidth=1;cx.strokeStyle='rgba(255,240,200,.9)';
  for(const r of DATA.roads){cx.beginPath();for(let i=0;i<r.p.length;i+=2){i?cx.lineTo(r.p[i],r.p[i+1]):cx.moveTo(r.p[i],r.p[i+1])}cx.stroke()}
  for(const n of DATA.nodes){const rad=n.t=='town'?4:n.t=='castle'?3.2:n.t=='village'?2.4:1.6;cx.beginPath();cx.arc(n.x,n.y,rad,0,7);cx.fillStyle='#302c23';cx.fill();cx.strokeStyle='#fff1cb';cx.lineWidth=1;cx.stroke()}
  for(const s of DATA.sites){const [x,y]=s.card.frame.referenceCentre,h=DATA.half;cx.lineWidth=active===s?3:2;cx.strokeStyle=css('--site')||'#c0392b';cx.strokeRect(x-h,y-h,2*h,2*h);
    cx.fillStyle=cx.strokeStyle;cx.font='bold 13px system-ui';cx.fillText(s.card.sceneId.replace('strat_site_',''),x-h,y-h-5)}
  if(pick){const h=DATA.half;cx.strokeStyle=css('--pick')||'#1f6fb2';cx.lineWidth=2;cx.setLineDash([5,4]);cx.strokeRect(pick.x-h,pick.y-h,2*h,2*h);cx.setLineDash([]);
    cx.beginPath();cx.arc(pick.x,pick.y,4,0,7);cx.fillStyle=cx.strokeStyle;cx.fill()}
}
function nearestRoad(x,y){let best=null;for(const r of DATA.roads){const p=r.p;for(let i=0;i+3<p.length;i+=2){const ax=p[i],ay=p[i+1],bx=p[i+2],by=p[i+3],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1e-12;
  let t=((x-ax)*dx+(y-ay)*dy)/L;t=Math.max(0,Math.min(1,t));const qx=ax+dx*t,qy=ay+dy*t,d=Math.hypot(qx-x,qy-y);if(!best||d<best.d)best={r,x:qx,y:qy,d,dx,dy}}}return best}
const f1=v=>(Math.round(v*10)/10).toFixed(1);
function windowHeading(r,x,y){const p=r.p,c=[0];for(let i=2;i<p.length;i+=2)c.push(c[c.length-1]+Math.hypot(p[i]-p[i-2],p[i+1]-p[i-1]));
  let best=0,bd=1e18,bc=0;for(let i=0;i+3<p.length;i+=2){const ax=p[i],ay=p[i+1],dx=p[i+2]-ax,dy=p[i+3]-ay,L=dx*dx+dy*dy||1e-12;let t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L));
    const d=Math.hypot(ax+dx*t-x,ay+dy*t-y);if(d<bd){bd=d;bc=c[i/2]+t*Math.sqrt(L)}}
  const at=s=>{s=Math.max(0,Math.min(c[c.length-1],s));let k=0;while(k<c.length-2&&c[k+1]<s)k++;const f=(s-c[k])/((c[k+1]-c[k])||1e-12);return [p[2*k]+(p[2*k+2]-p[2*k])*f,p[2*k+1]+(p[2*k+3]-p[2*k+1])*f]};
  const a=at(bc-3),b=at(bc+3);return heading(b[0]-a[0],b[1]-a[1])}
function heading(dx,dy){const m=((Math.atan2(-dy,dx)*180/Math.PI)%360+360)%360;return [m,((90-m)%360+360)%360]}
cv.addEventListener('click',e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*RW/b.width,y=(e.clientY-b.top)*RH/b.height;
  const s=DATA.sites.find(s=>{const [sx,sy]=s.card.frame.referenceCentre;return Math.abs(x-sx)<=DATA.half&&Math.abs(y-sy)<=DATA.half});
  if(s){showSite(s);return}
  const n=nearestRoad(x,y);pick={x:n.x,y:n.y};active=null;draw();
  const [m,br]=windowHeading(n.r,n.x,n.y),ws=DATA.worldScale;
  lastSpot={a:n.r.a,b:n.r.b,id:n.r.id,x:n.x,y:n.y,wx:n.x/ws,wy:n.y/ws,gap:n.d};
  panel.innerHTML=`<h2>Nearest road spot</h2><dl>
  <dt>Road</dt><dd>${n.r.a} - ${n.r.b}</dd><dt>Road id</dt><dd><code>${n.r.id}</code></dd>
  <dt>Reference px</dt><dd>${f1(n.x)}, ${f1(n.y)}</dd><dt>World XY</dt><dd>${(n.x/ws).toFixed(2)}, ${(n.y/ws).toFixed(2)}</dd>
  <dt>Click gap</dt><dd>${f1(n.d)} ref px (${Math.round(n.d*10)} m at battle scale)</dd>
  <dt>Scene heading</dt><dd>${f1(m)}&deg; from east, bearing ${f1(br)}&deg; (${n.r.a} &rarr; ${n.r.b})</dd></dl>
  <p>Card for this spot:</p><pre>py -3.14 tools/Mapmaker/battle_layer.py card --ref ${f1(n.x)} ${f1(n.y)} --scene strat_site_new_01 --expect-road ${n.r.id.slice(0,8)}</pre>
  <p><button class="btn" onclick="addSpot()">Add to my list</button><button class="btn ghost" onclick="copyText(spotLine(lastSpot),'copiedOne')">Copy this spot</button><span class="copied" id="copiedOne"></span></p>
  <p style="color:var(--muted)">The dashed square is the 800 m battle area around that spot.</p>`});
let lastSpot=null,spots=[];
function spotLine(s,i){return (i?'spot '+i+': ':'')+'road '+s.a+' - '+s.b+' | road id '+s.id+' | ref '+f1(s.x)+', '+f1(s.y)+' | world '+s.wx.toFixed(2)+', '+s.wy.toFixed(2)}
function addSpot(){if(!lastSpot)return;spots.push(lastSpot);renderSpots()}
function clearSpots(){spots=[];renderSpots()}
function renderSpots(){document.getElementById('spotcount').textContent='('+spots.length+')';
  document.getElementById('spotlist').innerHTML=spots.map((s,i)=>'<li>'+s.a+' - '+s.b+' <code>'+f1(s.x)+', '+f1(s.y)+'</code> <a href="#" onclick="spots.splice('+i+',1);renderSpots();return false">remove</a></li>').join('')}
function copyAll(){if(!spots.length){document.getElementById('copiedAll').textContent='Add spots first';return}
  copyText('Battle spots for the map maker:'+String.fromCharCode(10)+spots.map((s,i)=>spotLine(s,i+1)).join(String.fromCharCode(10)),'copiedAll')}
function copyText(t,id){const done=()=>{document.getElementById(id).textContent='Copied!'};
  const fallback=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){prompt('Copy this:',t)}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fallback);else fallback()}

function showSite(s){active=s;pick=null;draw();const c=s.card,v=c.biome.vibe,w=c.water,t=c.terrain,f=c.forest,r=c.recipe;

  <dl><dt>Vibe</dt><dd><b>${v.tag}</b> - ${v.reason}</dd><dt>Land biome</dt><dd>${fr} (land ${(c.biome.landFraction*100).toFixed(0)}%)</dd>
  <dt>Mud blend</dt><dd>${v.northernMudBlend} (snow ${v.snowDistanceRefPx} ref px away)</dd>
  <dt>Road</dt><dd>${c.road.nodeA} &rarr; ${c.road.nodeB}, heading ${c.road.sceneHeadingDegrees}&deg; / bearing ${c.road.sceneBearingDegrees}&deg;</dd>
  <dt>Relief</dt><dd>${t.class}: ${t.reliefMetres} m, mean slope ${t.meanSlopeDegrees}&deg;</dd>
  <dt>Forest</dt><dd>mean ${f.meanDensity}, max ${f.maxDensity}, cover ${(f.coverFraction*100).toFixed(0)}%</dd>
  <dt>Water</dt><dd>${w.kind}; river ${(w.riverFraction*100).toFixed(1)}%, sea ${(w.seaFraction*100).toFixed(1)}%; road crossed: ${w.riverCrossesBattleRoad?'yes':'no'}. Lakes: no data.</dd>
  <dt>Settlement inside</dt><dd>${c.nodes.settlementInside?c.nodes.settlementsInside.join(', '):'no'}</dd>
  <dt>Recipe</dt><dd>${r.groundPalette}; ${tm}; ridge ${r.reliefTarget.ridgeMetres} m, hills ${r.reliefTarget.hillMetres} m</dd></dl>
  <h2 style="font-size:14px">Roads in the square</h2><table><tr><th>Road</th><th>Inside</th><th>Entry&rarr;exit</th></tr>${roads}</table>
  <h2 style="font-size:14px;margin-top:10px">Nearest nodes</h2><table>${nodes}</table>
  <details><summary>Full card JSON</summary><pre>${JSON.stringify(c,null,1).replace(/</g,'&lt;')}</pre></details>`;
  const d=document.getElementById('diagram').getContext('2d'),g=s.grid,n=g.n,px=320/n,cl=b64(g.climate),rv=b64(g.river),fo=b64(g.forest);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const k=j*n+i;d.fillStyle=BIOME[cl[k]]||'#999';d.fillRect(i*px,j*px,px+.5,px+.5);
    if(fo[k]>0){d.fillStyle=`rgba(29,92,42,${Math.min(.85,fo[k]/200)})`;d.fillRect(i*px,j*px,px+.5,px+.5)}
    if(rv[k]){d.fillStyle='#2e6fd0';d.fillRect(i*px,j*px,px+.5,px+.5)}}
  const S=320/800;for(const x of c.roads)for(const p of x.pieces){d.beginPath();p.points.forEach((q,i)=>{const X=q[0]*S,Y=(800-q[1])*S;i?d.lineTo(X,Y):d.moveTo(X,Y)});
    d.strokeStyle='#3b2b17';d.lineWidth=x.isBattleRoad?5:3;d.stroke();d.strokeStyle='#ffe9b8';d.lineWidth=x.isBattleRoad?2:1;d.stroke()}
  for(const nd of c.nodes.insideSquare){const X=nd.scenePoint[0]*S,Y=(800-nd.scenePoint[1])*S;d.beginPath();d.arc(X,Y,5,0,7);d.fillStyle='#302c23';d.fill();d.fillStyle='#000';d.font='11px system-ui';d.fillText(nd.name,X+7,Y+4)}
  d.beginPath();d.arc(160,160,5,0,7);d.fillStyle='#c0392b';d.fill();
  d.fillStyle='#000';d.font='bold 11px system-ui';d.fillText('N',305,14);d.fillText('800 m',6,314)}
const btns=document.getElementById('sitebtns');
for(const s of DATA.sites){const b=document.createElement('button');b.textContent=s.card.sceneId.replace('strat_site_','');b.onclick=()=>{showSite(s);
  const [x,y]=s.card.frame.referenceCentre;wrap.scrollTo({left:x/RW*cv.clientWidth-wrap.clientWidth/2,top:y/RH*cv.clientHeight-wrap.clientHeight/2,behavior:'smooth'})};btns.appendChild(b)}
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-z]').forEach(o=>o.classList.toggle('on',o===b));
  cv.style.width=b.dataset.z=='fit'?'100%':(RW*b.dataset.z)+'px'});
</script>
